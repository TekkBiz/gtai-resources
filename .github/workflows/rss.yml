name: Build micro1 RSS feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rss.yml'
      - 'rss_generator.py'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    env:
      REFERRAL_CODE: 6169d433-2a46-407a-9317-40fb3df9cd2c
      OUTPUT: feed.xml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate feed
        run: python rss_generator.py

      - name: Commit and push feed
        run: |
          git switch main || git switch -c main
          git add feed.xml
          git -c user.name='rss-bot' -c user.email='actions@github.com' commit -m 'chore: refresh jobs feed [skip ci]' || echo 'No changes to commit'
          git push origin main
